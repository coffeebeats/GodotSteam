name: "🚀 Release: Plugin version"

on:
  push:
    branches:
      - gdextension-plugin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: coffeebeats/godot-infra/actions/package-addon@v6
        with:
          subfolder: godotsteam
          file-excludes: |
            androidarm64
            linux32
            linuxarm64
            win32
